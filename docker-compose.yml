services:
  scrapper:
    build:
      context: .
      dockerfile: Dockerfile.scrapper
    platform: linux/amd64
    container_name: race-stats-scrapper
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
    environment:
      - PORT=3001
      - DB_PATH=/app/data/race_data.db
      - NODE_ENV=production
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - BACKEND_URL=http://backend:3000
    volumes:
      - scrapper_data:/app/data
    networks:
      - race-stats-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: race-stats-backend
    environment:
      - PORT=3000
      - DB_PATH=/app/data/race_data.db
      - NODE_ENV=production
      - SCRAPPER_URL=http://scrapper:3001
    volumes:
      - backend_data:/app/data
    depends_on:
      scrapper:
        condition: service_healthy
    networks:
      - race-stats-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    platform: linux/amd64
    container_name: race-stats-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - race-stats-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.race-stats-frontend.rule=Host(`karting.sky-apps.uk`)"
      - "traefik.http.routers.race-stats-frontend.entrypoints=web"
      - "traefik.http.services.race-stats-frontend.loadbalancer.server.port=80"

volumes:
  backend_data:
  scrapper_data:

networks:
  race-stats-network:
    driver: bridge

